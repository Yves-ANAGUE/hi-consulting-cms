<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{balisesMeta}}
  <link rel="icon" href="/static/images/logo_HICI.jpg">
  <link rel="stylesheet" href="/static/css/style.css">
  
  <!-- Personnalisation de l'affichage asymétrique des témoignages -->
  <style>
    /* Configuration de la carte en deux colonnes (Gauche / Droite) */
    .piste-carrousel-temoignages > div,
    .carte-temoignage {
      display: grid !important;
      grid-template-columns: 200px 1fr !important;
      gap: 2.5rem !important;
      align-items: start !important;
      text-align: left !important;
      padding: 3rem !important;
      background: #ffffff !important;
      border-radius: 16px !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05) !important;
    }

    /* ==========================================================================
       COLONNE GAUCHE : PHOTO, NOM, ÉTOILES & PAYS
       ========================================================================== */
    /* Conteneur global créé virtuellement ou ciblé pour forcer l'empilement à gauche */
    .colonne-gauche-temoignage {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1rem;
    }

    /* Conteneur d'image pour isoler le zoom sans faire déborder la photo */
    .piste-carrousel-temoignages .conteneur-avatar,
    .carte-temoignage .conteneur-avatar {
      width: 150px !important;
      height: 150px !important;
      border-radius: 12px !important; /* Format carré moderne aux coins arrondis */
      overflow: hidden !important;
      border: 3px solid #A32626 !important;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1) !important;
    }

    /* Style de la photo et effet de zoom fluide au survol */
    .piste-carrousel-temoignages img,
    .carte-temoignage img,
    .avatar-temoignage {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1) !important;
    }

    .piste-carrousel-temoignages > div:hover img,
    .carte-temoignage:hover img {
      transform: scale(1.12) !important; /* Zoom progressif au survol de la carte */
    }

    /* Réalignement des métadonnées sous la photo à gauche */
    .piste-carrousel-temoignages h3,
    .carte-temoignage h3,
    .nom-temoignage,
    .etoiles-temoignage,
    .pays-temoignage,
    .info-temoignage {
      text-align: left !important;
      margin: 0 !important;
      display: block !important;
    }

    .piste-carrousel-temoignages h3, .carte-temoignage h3 {
      font-size: 1.25rem !important;
      font-weight: 700 !important;
      color: #1a1a1a !important;
      margin-top: 0.5rem !important;
    }

    /* ==========================================================================
       COLONNE DROITE : BOUTON VIDÉO & TEXTE DU TÉMOIGNAGE
       ========================================================================== */
    /* Force l'alignement des éléments textuels et du bouton à droite */
    .piste-carrousel-temoignages .contenu-droite,
    .carte-temoignage .contenu-droite {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5rem;
      width: 100%;
    }

    /* Style du bouton "Voir la vidéo" placé en haut à droite du bloc de contenu */
    .piste-carrousel-temoignages btn,
    .carte-temoignage button:not(.bouton-carrousel),
    .bouton-video-temoignage {
      order: -1 !important; /* Positionne le bouton tout en haut de la colonne droite */
      align-self: flex-start !important;
      background-color: #A32626 !important;
      color: #ffffff !important;
      border: none !important;
      padding: 0.8rem 1.8rem !important;
      font-weight: 600 !important;
      border-radius: 8px !important;
      cursor: pointer !important;
      transition: all 0.3s ease !important;
      box-shadow: 0 4px 12px rgba(163, 38, 38, 0.2) !important;
    }

    .piste-carrousel-temoignages button:not(.bouton-carrousel):hover,
    .bouton-video-temoignage:hover {
      background-color: #821e1e !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 6px 15px rgba(163, 38, 38, 0.3) !important;
    }

    /* Typographie descriptive du témoignage textuel */
    .piste-carrousel-temoignages p,
    .carte-temoignage p,
    .texte-temoignage {
      font-size: 1.1rem !important;
      line-height: 1.7 !important;
      color: #4a4a4a !important;
      margin: 0 !important;
    }

    /* Responsive : Repasse sur une seule colonne pour les smartphones */
    @media (max-width: 768px) {
      .piste-carrousel-temoignages > div,
      .carte-temoignage {
        grid-template-columns: 1fr !important;
        gap: 1.5rem !important;
        padding: 2rem !important;
        text-align: center !important;
      }
      .colonne-gauche-temoignage,
      .piste-carrousel-temoignages .contenu-droite,
      .carte-temoignage .contenu-droite,
      .piste-carrousel-temoignages h3,
      .carte-temoignage h3,
      .piste-carrousel-temoignages button:not(.bouton-carrousel) {
        align-items: center !important;
        align-self: center !important;
        text-align: center !important;
      }
      .piste-carrousel-temoignages .conteneur-avatar,
      .carte-temoignage .conteneur-avatar {
        margin: 0 auto !important;
      }
    }
  </style>

  <script type="application/ld+json">{{schemaTemoignages}}</script>
</head>
<body>
  {{> _entete.html}}

  <main>
    <section class="entete-page conteneur">
      <h1 data-cle-i18n="temoignages_titre_page">Témoignages de Réussite</h1>
      <p data-cle-i18n="temoignages_sous_titre">Ils ont fait confiance à HI CONSULTING IMMIGRATION.</p>
    </section>

    <section class="conteneur section-sans-haut">
      <div class="carrousel-temoignages">
        <button id="boutonPrecedentTemoignage" class="bouton-carrousel bouton-carrousel-gauche" aria-label="Témoignage précédent">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div id="pisteCarrouselTemoignages" class="piste-carrousel-temoignages">
          <div class="squelette-carte"></div>
          <div class="squelette-carte"></div>
          <div class="squelette-carte"></div>
        </div>
        <button id="boutonSuivantTemoignage" class="bouton-carrousel bouton-carrousel-droite" aria-label="Témoignage suivant">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div id="indicateursCarrouselTemoignages" class="indicateurs-carrousel"></div>
    </section>
  </main>

  <div id="modaleVideo" class="modale-video" hidden>
    <div class="modale-video-contenu">
      <button id="fermerModaleVideo" aria-label="Fermer">&times;</button>
      <div id="conteneurIframeVideo"></div>
    </div>
  </div>

  {{> _pied.html}}
  <script src="/static/js/temoignages.js"></script>
</body>
</html>
