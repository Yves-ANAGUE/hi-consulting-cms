<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{balisesMeta}}
  <link rel="icon" href="/static/images/logo_HICI.jpg">
  <link rel="stylesheet" href="/static/css/style.css">
  
  <style>
    /* Bloque le footer tout en bas de la page */
    html, body {
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    body {
      display: flex !important;
      flex-direction: column !important;
    }
    main {
      flex: 1 0 auto !important;
    }

    /* ==========================================================================
       ARCHITECTURE DU CARROUSEL
       ========================================================================== */
    .carrousel-temoignages {
      position: relative !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      max-width: 850px !important;
      margin: 0 auto 3rem auto !important;
      padding: 0 1rem !important;
    }

    .piste-carrousel-temoignages {
      position: relative !important;
      width: 100% !important;
      min-height: 350px !important;
      display: block !important;
    }

    /* Gestion des transitions gérées par votre JS */
    .diapositive-temoignage {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      opacity: 0 !important;
      visibility: hidden !important;
      transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out !important;
      z-index: 1 !important;
      box-sizing: border-box !important;
    }

    .diapositive-temoignage.active {
      position: relative !important;
      opacity: 1 !important;
      visibility: visible !important;
      z-index: 2 !important;
    }

    /* ==========================================================================
       RENDU ORDINATEUR : ENRICHIT AVEC LA BORDURE ANIMÉE TOURNANTE
       ========================================================================== */
    .diapositive-temoignage {
      display: flex !important;
      flex-direction: row !important;
      justify-content: flex-start !important;
      align-items: start !important;
      gap: 3rem !important;
      padding: 2.5rem !important;
      background: #ffffff !important;
      border-radius: 16px !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05) !important;
      
      /* Paramètres de la bordure magique tournante */
      position: relative !important;
      border: 3px solid transparent !important;
      background-clip: padding-box !important;
    }

    /* Le dégradé progressif multicolore en arrière-plan */
    .diapositive-temoignage::before {
      content: '' !important;
      position: absolute !important;
      top: -3px !important; left: -3px !important; right: -3px !important; bottom: -3px !important;
      background: conic-gradient(#A32626, #0077b6, #e9c46a, #A32626) !important;
      border-radius: 16px !important;
      z-index: -1 !important;
      animation: rotationBordureTemoignage 8s linear infinite !important;
    }

    /* Taille de la photo légèrement augmentée sur Ordinateur */
    .diapositive-temoignage img {
      display: block !important;
      width: 165px !important; /* Modifié de 150px à 165px pour être plus grand */
      height: 165px !important;
      min-width: 165px !important;
      min-height: 165px !important;
      object-fit: cover !important;
      border-radius: 12px !important;
      border: 3px solid #A32626 !important;
      margin: 0 !important;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08) !important;
    }

    /* Style global des textes intérieurs injectés */
    .diapositive-temoignage h3 {
      font-size: 1.2rem !important;
      font-weight: 700 !important;
      color: #1a1a1a !important;
      margin: 0.5rem 0 0.3rem 0 !important;
    }

    /* Bouton vidéo d'action (.bouton-voir-video généré par votre script) */
    .bouton-voir-video {
      background-color: #A32626 !important;
      color: #ffffff !important;
      border: none !important;
      padding: 0.6rem 1.6rem !important;
      font-size: 0.95rem !important;
      font-weight: 600 !important;
      border-radius: 8px !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      box-shadow: 0 4px 12px rgba(163, 38, 38, 0.15) !important;
      margin-bottom: 1rem !important;
      display: inline-block !important;
    }

    .bouton-voir-video:hover {
      background-color: #821e1e !important;
      transform: translateY(-2px) !important;
    }

    .diapositive-temoignage p {
      font-size: 1.05rem !important;
      line-height: 1.6 !important;
      color: #4a4a4a !important;
      margin: 0 !important;
    }

    /* ==========================================================================
       CONTROLES DE NAVIGATION CENTRÉS EN DESSOUS
       ========================================================================== */
    .bloc-controles-carrousel {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 2rem !important;
      margin-top: 1.5rem !important;
      width: 100% !important;
    }

    .bouton-carrousel {
      position: static !important;
      transform: none !important;
      background: #ffffff !important;
      border: 2px solid #e2e8f0 !important;
      color: #333333 !important;
      width: 46px !important;
      height: 46px !important;
      border-radius: 50% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
    }

    .bouton-carrousel:hover {
      background: #f8fafc !important;
      border-color: #A32626 !important;
      color: #A32626 !important;
    }

    /* KEYFRAME DE LA ROTATION MULTICOLORE */
    @keyframes rotationBordureTemoignage {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ==========================================================================
       RENDU MOBILE : UNE SEULE COLONNE PARFAITEMENT RE-ORDONNÉE EN CSS
       ========================================================================== */
    @media (max-width: 768px) {
      .diapositive-temoignage {
        display: flex !important;
        flex-direction: column !important; /* Tout empiler verticalement */
        align-items: center !important;
        text-align: center !important;
        padding: 1.5rem !important;
        gap: 1rem !important;
      }

      /* Rangement dans l'ordre exact demandé sur mobile via CSS Order */
      .bouton-voir-video {
        order: 1 !important; /* Le bouton vidéo en premier tout en haut */
        margin: 0 auto 0.5rem auto !important;
      }

      .diapositive-temoignage img {
        order: 2 !important; /* La photo en deuxième position */
        width: 165px !important; /* Grande taille demandée conservée */
        height: 165px !important;
        min-width: 165px !important;
        min-height: 165px !important;
        margin: 0 auto !important;
      }

      .diapositive-temoignage h3 { 
        order: 3 !important; 
        text-align: center !important;
      }
      
      /* Cible les textes complémentaires injectés (étoiles, pays) */
      .diapositive-temoignage div, 
      .diapositive-temoignage span { 
        order: 4 !important; 
        text-align: center !important;
      }

      .diapositive-temoignage p {
        order: 5 !important; /* Le texte de témoignage tout en bas */
        text-align: center !important;
        margin: 0 auto !important;
      }
    }
  </style>

  <script type="application/ld+json">{{schemaTemoignages}}</script>
</head>
<body>
  {{> _entete.html}}

  <main>
    <section class="entete-page conteneur">
      <h1 data-cle-i18n="temoignages_titre_page">Témoignages de Réussite</h1>
      <p data-cle-i18n="temoignages_sous_titre">Ils ont fait confiance à HI CONSULTING IMMIGRATION.</p>
    </section>

    <section class="conteneur section-sans-haut">
      <div class="carrousel-temoignages">
        
        <!-- Piste cible directe de votre script temoignages.js -->
        <div id="pisteCarrouselTemoignages" class="piste-carrousel-temoignages">
          <div class="squelette-carte"></div>
          <div class="squelette-carte"></div>
          <div class="squelette-carte"></div>
        </div>
        
        <!-- Zone des boutons de contrôle centrés en dessous -->
        <div class="bloc-controles-carrousel">
          <button id="boutonPrecedentTemoignage" class="bouton-carrousel" aria-label="Témoignage précédent">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          
          <div id="indicateursCarrouselTemoignages" class="indicateurs-carrousel" style="margin: 0 !important;"></div>
          <button id="boutonSuivantTemoignage" class="bouton-carrousel" aria-label="Témoignage suivant">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

      </div>
    </section>
  </main>

  <div id="modaleVideo" class="modale-video" hidden>
    <div class="modale-video-contenu">
      <button id="fermerModaleVideo" aria-label="Fermer">&times;</button>
      <div id="conteneurIframeVideo"></div>
    </div>
  </div>

  {{> _pied.html}}
  <script src="/static/js/temoignages.js"></script>

  <!-- Script de ralentissement du carrousel à 12 secondes -->
  <script>
    window.addEventListener('load', () => {
      let boucle = 0;
      const intercepteurMinuteur = setInterval(() => {
        const btnSuivant = document.getElementById('boutonSuivantTemoignage');
        const points = document.querySelectorAll('.point-indicateur');
        
        if (btnSuivant && points.length > 0) {
          if (window.minuteurDefilementAuto) {
            clearInterval(window.minuteurDefilementAuto);
          }
          // Nouveau cycle de 12 secondes
          setInterval(() => {
            btnSuivant.click();
          }, 12000);

          clearInterval(intercepteurMinuteur);
        }
        if (++boucle > 30) clearInterval(intercepteurMinuteur);
      }, 200);
    });
  </script>
</body>
</html>
