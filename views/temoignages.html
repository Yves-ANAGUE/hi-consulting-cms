<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{balisesMeta}}
  <link rel="icon" href="/static/images/logo_HICI.jpg">
  <link rel="stylesheet" href="/static/css/style.css">
  
  <!-- Personnalisation de l'affichage des cartes de témoignages -->
  <style>
    /* Force les cartes du carrousel à empiler les éléments verticalement */
    .piste-carrousel-temoignages > div,
    .carte-temoignage {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      text-align: center !important;
      padding: 2.5rem 1.5rem !important;
    }

    /* Repositionne la photo tout en haut et l'agrandit */
    .piste-carrousel-temoignages img,
    .carte-temoignage img,
    .avatar-temoignage {
      order: -1 !important; /* Force l'image à passer au-dessus des autres éléments */
      width: 120px !important; /* Augmentation de la taille (généralement 60px à 80px) */
      height: 120px !important;
      max-width: 120px !important;
      max-height: 120px !important;
      object-fit: cover !important;
      border-radius: 50% !important; /* Conserve la photo parfaitement ronde */
      margin-bottom: 1.5rem !important; /* Espace entre la photo et les textes en bas */
      border: 3px solid var(--couleur-primaire, #A32626); /* Ajout d'une bordure élégante */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    /* Réalignement du bloc de contenu textuel (nom, texte, étoiles) */
    .contenu-temoignage,
    .texte-temoignage {
      width: 100% !important;
    }
  </style>

  <script type="application/ld+json">{{schemaTemoignages}}</script>
</head>
<body>
  {{> _entete.html}}

  <main>
    <section class="entete-page conteneur">
      <h1 data-cle-i18n="temoignages_titre_page">Témoignages de Réussite</h1>
      <p data-cle-i18n="temoignages_sous_titre">Ils ont fait confiance à HI CONSULTING IMMIGRATION.</p>
    </section>

    <section class="conteneur section-sans-haut">
      <div class="carrousel-temoignages">
        <button id="boutonPrecedentTemoignage" class="bouton-carrousel bouton-carrousel-gauche" aria-label="Témoignage précédent">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div id="pisteCarrouselTemoignages" class="piste-carrousel-temoignages">
          <div class="squelette-carte"></div>
          <div class="squelette-carte"></div>
          <div class="squelette-carte"></div>
        </div>
        <button id="boutonSuivantTemoignage" class="bouton-carrousel bouton-carrousel-droite" aria-label="Témoignage suivant">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div id="indicateursCarrouselTemoignages" class="indicateurs-carrousel"></div>
    </section>
  </main>

  <div id="modaleVideo" class="modale-video" hidden>
    <div class="modale-video-contenu">
      <button id="fermerModaleVideo" aria-label="Fermer">&times;</button>
      <div id="conteneurIframeVideo"></div>
    </div>
  </div>

  {{> _pied.html}}
  <script src="/static/js/temoignages.js"></script>
</body>
</html>
